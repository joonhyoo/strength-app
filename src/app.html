<!doctype html>
<html lang="en" data-theme="brand">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-180.png" />
		<meta name="theme-color" content="#0D0D0F" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Strength App" />

		<!--
			iOS launch images. A PWA with no matching `apple-touch-startup-image`
			shows a blank screen during launch; these bridge that gap with the
			same dark ground + centred mark as #app-splash. Portrait only — this
			app is used upright. Regenerate: bash scripts/gen-ios-splash.sh
		-->
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-640-1136.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-750-1334.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-828-1792.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1125-2436.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1242-2208.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1242-2688.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1170-2532.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1179-2556.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 428px) and (device-height: 926px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1284-2778.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1290-2796.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 402px) and (device-height: 874px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1206-2622.png"
		/>
		<link
			rel="apple-touch-startup-image"
			media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
			href="%sveltekit.assets%/apple-splash-1320-2868.png"
		/>

		<style>
			/* Painted before any external stylesheet or framework JS, so the first
			   frame of a cold PWA launch is the app's dark ground — never a white
			   flash — with the mark centred. */
			html,
			body {
				background: #0d0d0f;
			}
			#app-splash {
				position: fixed;
				inset: 0;
				z-index: 2147483647;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #0d0d0f;
			}
			/* The mark breathes gently while the app loads. Starts at full
			   opacity so it appears solid the instant it paints — no fade-in. */
			#app-splash svg {
				animation: app-splash-pulse 2.2s ease-in-out infinite;
			}
			@keyframes app-splash-pulse {
				0%,
				100% {
					opacity: 1;
				}
				50% {
					opacity: 0.55;
				}
			}
			@media (prefers-reduced-motion: reduce) {
				#app-splash svg {
					animation: none;
					opacity: 0.85;
				}
			}
		</style>
		%sveltekit.head%
	</head>
	<!--
		Every link replaces rather than pushes, so the history stack stays at depth 1.
		iOS keeps its edge-swipe back/forward gesture even in an installed PWA and no
		web API can suppress it — but with nothing to pop it becomes inert, freeing the
		full screen width for the day-swipe on /train. Link options are read by walking
		up the DOM, so declaring it on <body> covers the whole app.
	-->
	<body data-sveltekit-preload-data="tap" data-sveltekit-replacestate>
		<!--
			Static splash. Painted from the first byte of the `/` document (which the
			service worker serves from cache, prerendered), before any framework JS.
			It sits *outside* the SvelteKit mount point below, so the client-side
			navigation from `/` to the real route (src/routes/+page.svelte) never
			touches it — the mark stays on screen continuously through that hop and
			the destination's load, then src/routes/+layout.svelte fades it out once
			the destination has rendered. Styles are inlined in <head>.
		-->
		<div id="app-splash" aria-hidden="true">
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="96" height="96">
				<defs>
					<linearGradient id="splashGradient" x1="0" y1="0" x2="1" y2="1">
						<stop offset="0%" stop-color="#F1E0C5" />
						<stop offset="50%" stop-color="#F46036" />
						<stop offset="100%" stop-color="#D7263D" />
					</linearGradient>
				</defs>
				<path
					fill="url(#splashGradient)"
					d="M 21.6,7.231 L 21.6,15.603 A 0.645,0.645 0 0,1 21.308,16.109 L 21.033,16.273 C 19.665,17.065 18.46,17.762 17.243,18.464 L 17.243,9.41 L 9.404,4.878 C 10.761,4.099 12.113,3.313 13.471,2.538 A 0.647,0.647 0 0,1 14.055,2.538 L 21.599,6.894 L 21.599,7.231 L 21.6,7.231 M 14.549,11.792 L 14.549,18.071 A 0.484,0.484 0 0,1 14.329,18.451 L 14.124,18.574 C 13.097,19.168 12.194,19.691 11.281,20.217 L 11.281,13.427 L 5.402,10.028 C 6.419,9.444 7.433,8.854 8.452,8.272 A 0.485,0.485 0 0,1 8.89,8.272 L 14.548,11.54 L 14.548,11.792 L 14.549,11.792 M 9.26,15.213 L 9.26,19.923 A 0.363,0.363 0 0,1 9.096,20.207 L 8.941,20.3 C 8.172,20.745 7.494,21.137 6.81,21.532 L 6.81,16.439 L 2.4,13.89 C 3.163,13.452 3.923,13.009 4.687,12.573 A 0.364,0.364 0 0,1 5.016,12.573 L 9.259,15.024 L 9.259,15.213 L 9.26,15.213"
				/>
			</svg>
		</div>
		<script>
			// Cold-launch safety nets. This is a classic <script>, so it runs even
			// when the module bundle fails to load/execute (a stale service-worker
			// shell after a deploy, a JS error) — the one case the in-app splash
			// dismissal can't cover.
			addEventListener('load', function () {
				// Still on `/` well after launch means the bootstrap in
				// src/routes/+page.svelte stalled — its goto() hung on the auth
				// resolution, or hydration never ran so onMount never fired. Both
				// the in-app dismissSplash and the removal below skip `/`, so
				// there is otherwise no way off the pulsing splash. Break out with
				// a full document navigation: it re-resolves auth server-side and
				// can't be held up by a stuck client fetch.
				setTimeout(function () {
					if (location.pathname !== '/') return;
					var home = '/auth/login';
					try {
						var m = document.cookie.match(/(?:^|; )home=([^;]*)/);
						if (m) {
							var h = decodeURIComponent(m[1]);
							if (h && h !== '/') home = h;
						}
					} catch (e) {
						/* malformed cookie — fall through to /auth/login */
					}
					location.replace(home);
				}, 5000);

				// Off `/` but the splash is still up (a slow destination load, or a
				// JS error after the nav) — don't leave the pulse indefinitely.
				setTimeout(function () {
					if (location.pathname === '/') return;
					var s = document.getElementById('app-splash');
					if (s) s.remove();
				}, 4000);
			});
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
