<!doctype html>
<!-- style attr, not just the <style> rule below: it lands a frame earlier and
     covers the iOS overscroll rubber-band. color-scheme dark from the first
     byte means the UA backdrop (what shows behind an unpainted region or a
     compositing blend) is near-black, not the light-scheme white. -->
<html lang="en" data-theme="brand" style="background-color: #0d0d0f; color-scheme: dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark" />
		<link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.json" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-180.png" />
		<meta name="theme-color" content="#0D0D0F" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<!-- `black-translucent`, not `black`: the web view runs full-bleed under
		     the status bar, which is what env(safe-area-inset-top) and 100vh are
		     written against throughout the app. -->
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<meta name="apple-mobile-web-app-title" content="Strength App" />

		<style>
			/* One colour for the whole launch — this cover and every first screen
			   (auth / app) are all #0d0d0f, so no handoff can flash. Painted
			   before any framework JS, and before anything over the network:
			   kit.inlineStyleThreshold inlines the app CSS and the mark below is
			   inline SVG, so nothing render-blocking stands between the document
			   and the first paint. That matters more than it looks — while the
			   first paint is blocked the web view is its own default *white*, and
			   iOS composites that. */
			:root {
				color-scheme: dark;
			}
			html,
			body {
				background: #0d0d0f;
			}
			/* Covers the whole cold-start path: the prerendered `/` shell, the
			   client hop to the real route, and that route's load.
			   src/routes/+layout.svelte's dismissSplash then reveals the settled
			   screen with a View Transition: the mark glides into the
			   destination's own mark where there is one, otherwise the whole
			   cover crossfades — #0d0d0f on #0d0d0f either way.

			   There is deliberately no apple-touch-startup-image. One that
			   matched this cover pixel-for-pixel still left a visible lift at the
			   handoff: iOS cross-dissolves the launch image into the web view and
			   its opacity curves briefly sum past 1, blending the white window
			   backdrop in. With no launch image there is no image layer and no
			   cross-dissolve — iOS just fades the web view up over black, which
			   measures strictly monotonic. The cost is ~180ms of black at the
			   very front, which reads as an ordinary app open. */
			#app-splash {
				position: fixed;
				top: 0;
				left: 0;
				right: 0;
				/* 100vh, not `inset: 0` / `bottom: 0`: on an iOS PWA the layout
				   viewport briefly resizes as the launch animation settles and the
				   status-bar area is reclaimed, which slid a `bottom: 0` box — and
				   its flex-centred mark — downward mid-splash. `100vh` is the
				   stable large-viewport height, resolved once. */
				height: 100vh;
				z-index: 2147483647;
				display: flex;
				align-items: center;
				justify-content: center;
				background: #0d0d0f;
			}
			#app-splash svg {
				width: 96px;
				height: 96px;
			}
			/* On reveal, dismissSplash tags this mark `app-splash-mark` only when
			   the destination has its own mark to morph into (0.42s glide);
			   otherwise the mark stays part of `root` and the whole cover just
			   crossfades over the unchanging #0d0d0f. dismissSplash skips the
			   View Transition entirely under prefers-reduced-motion. */
			::view-transition-group(app-splash-mark) {
				animation-duration: 0.42s;
				animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1);
			}
			::view-transition-old(root),
			::view-transition-new(root) {
				animation-duration: 0.22s;
			}
		</style>
		%sveltekit.head%
	</head>
	<!--
		Every link replaces rather than pushes, so the history stack stays at depth 1.
		iOS keeps its edge-swipe back/forward gesture even in an installed PWA and no
		web API can suppress it — but with nothing to pop it becomes inert, freeing the
		full screen width for the day-swipe on /train. Link options are read by walking
		up the DOM, so declaring it on <body> covers the whole app.
	-->
	<body data-sveltekit-preload-data="tap" data-sveltekit-replacestate>
		<!--
			Static splash. Painted from the first byte of the `/` document (which the
			service worker serves from cache, prerendered), before any framework JS.
			It sits *outside* the SvelteKit mount point below, so the client-side
			navigation from `/` to the real route (src/routes/+page.svelte) never
			touches it — the mark stays on screen continuously through that hop and
			the destination's load, then src/routes/+layout.svelte fades it out once
			the destination has rendered. Styles are inlined in <head>.
		-->
		<div id="app-splash" aria-hidden="true">
			<!-- Inline SVG, not <img src>: it needs no network fetch and no decode, so
			     it is on screen at the very first paint, and it is sharp at every
			     device pixel ratio. (It was briefly a shared PNG, byte-matched to an
			     iOS launch image; with no launch image there is nothing to match.)
			     Same path as src/lib/components/AuthHeader.svelte's mark, which the
			     reveal morphs into — keep the two in step. -->
			<svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="96" height="96">
				<defs>
					<linearGradient id="splashGradient" x1="0" y1="0" x2="1" y2="1">
						<stop offset="0%" stop-color="#F1E0C5" />
						<stop offset="50%" stop-color="#F46036" />
						<stop offset="100%" stop-color="#D7263D" />
					</linearGradient>
				</defs>
				<path
					fill="url(#splashGradient)"
					d="M 21.6,7.231 L 21.6,15.603 A 0.645,0.645 0 0,1 21.308,16.109 L 21.033,16.273 C 19.665,17.065 18.46,17.762 17.243,18.464 L 17.243,9.41 L 9.404,4.878 C 10.761,4.099 12.113,3.313 13.471,2.538 A 0.647,0.647 0 0,1 14.055,2.538 L 21.599,6.894 L 21.599,7.231 L 21.6,7.231 M 14.549,11.792 L 14.549,18.071 A 0.484,0.484 0 0,1 14.329,18.451 L 14.124,18.574 C 13.097,19.168 12.194,19.691 11.281,20.217 L 11.281,13.427 L 5.402,10.028 C 6.419,9.444 7.433,8.854 8.452,8.272 A 0.485,0.485 0 0,1 8.89,8.272 L 14.548,11.54 L 14.548,11.792 L 14.549,11.792 M 9.26,15.213 L 9.26,19.923 A 0.363,0.363 0 0,1 9.096,20.207 L 8.941,20.3 C 8.172,20.745 7.494,21.137 6.81,21.532 L 6.81,16.439 L 2.4,13.89 C 3.163,13.452 3.923,13.009 4.687,12.573 A 0.364,0.364 0 0,1 5.016,12.573 L 9.259,15.024 L 9.259,15.213 L 9.26,15.213"
				/>
			</svg>
		</div>
		<script>
			// Cold-launch safety nets. This is a classic <script>, so it runs even
			// when the module bundle fails to load/execute (a stale service-worker
			// shell after a deploy, a JS error) — the one case the in-app splash
			// dismissal can't cover.
			addEventListener('load', function () {
				// Still on `/` well after launch means the bootstrap in
				// src/routes/+page.svelte stalled — its goto() hung on the auth
				// resolution, or hydration never ran so onMount never fired. Both
				// the in-app dismissSplash and the removal below skip `/`, so
				// there is otherwise no way off the splash. Break out with a full
				// document navigation: it re-resolves auth server-side and can't
				// be held up by a stuck client fetch.
				setTimeout(function () {
					if (location.pathname !== '/') return;
					var home = '/auth/login';
					try {
						var m = document.cookie.match(/(?:^|; )home=([^;]*)/);
						if (m) {
							var h = decodeURIComponent(m[1]);
							if (h && h !== '/') home = h;
						}
					} catch (e) {
						/* malformed cookie — fall through to /auth/login */
					}
					location.replace(home);
				}, 5000);

				// Last resort: off `/` but dismissSplash never ran (a JS error
				// after the nav). Long enough that it never pre-empts a normal
				// slow auth resolution.
				setTimeout(function () {
					if (location.pathname === '/') return;
					var s = document.getElementById('app-splash');
					if (s) s.remove();
				}, 8000);
			});
		</script>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
