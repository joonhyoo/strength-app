<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!--
			This design is intentionally dark, not light-with-a-dark-variant, so
			declare "dark" only (not "light dark") — that tells clients this HTML
			already IS the dark-mode design and stops them auto-applying their own
			dark-mode color inversion/filter on top of it, which is what actually
			causes low-contrast/garish results, not the color values themselves.
		-->
		<meta name="color-scheme" content="dark" />
		<meta name="supported-color-schemes" content="dark" />
	</head>
	<body
		style="
			margin: 0;
			padding: 0;
			background-color: #0d0d0f;
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
		"
	>
		<table
			width="100%"
			cellpadding="0"
			cellspacing="0"
			style="background-color: #0d0d0f; padding: 40px 0"
		>
			<tr>
				<td align="center">
					<table
						width="480"
						cellpadding="0"
						cellspacing="0"
						style="
							background-color: #141416;
							border: 1px solid #252528;
							border-radius: 12px;
							overflow: hidden;
						"
					>
						<tr>
							<td style="padding: 0; line-height: 0; font-size: 0">
								<div style="height: 4px; background-color: #f46036"></div>
							</td>
						</tr>
						<tr>
							<td style="padding: 32px 40px 4px; text-align: center">
								<table cellpadding="0" cellspacing="0" style="margin: 0 auto">
									<tr>
										<td style="padding-right: 8px; vertical-align: middle">
											<img
												src="https://hyuji.dev/strength-app-192.png"
												width="20"
												height="20"
												alt="Strength App"
												style="display: block; width: 20px; height: 20px"
											/>
										</td>
										<td style="vertical-align: middle">
											<p
												style="
													margin: 0;
													font-size: 12px;
													font-weight: 700;
													letter-spacing: 2px;
													color: #a8a6a0;
													text-transform: uppercase;
												"
											>
												Strength App
											</p>
										</td>
									</tr>
								</table>
							</td>
						</tr>
						<tr>
							<td style="padding: 12px 40px 0; text-align: center">
								<h1
									style="
										margin: 0;
										font-size: 28px;
										font-weight: 700;
										color: #f0efe9;
										letter-spacing: -0.5px;
									"
								>
									Your coach invited you
								</h1>
							</td>
						</tr>
						<tr>
							<td style="padding: 16px 40px 0; text-align: center">
								<p style="margin: 0; font-size: 15px; line-height: 1.5; color: #f0efe9">
									Confirm your email to get started tracking your training on strength-app.
								</p>
							</td>
						</tr>
						<tr>
							<td style="padding: 28px 40px 0; text-align: center">
								<a
									href="{{ .SiteURL }}/auth/confirmed?token_hash={{ .TokenHash }}"
									target="_blank"
									rel="noopener noreferrer"
									style="
										display: inline-block;
										background-color: #f46036;
										color: #0d0d0f;
										font-weight: 700;
										font-size: 15px;
										padding: 14px 32px;
										border-radius: 8px;
										text-decoration: none;
									"
								>
									Confirm Email
								</a>
							</td>
						</tr>
						<tr>
							<td style="padding: 24px 40px 32px; text-align: center">
								<p style="margin: 0; font-size: 13px; line-height: 1.5; color: #a8a6a0">
									This invite is for<br />
									<strong style="color: #f0efe9">{{ .Email }}</strong>
								</p>
							</td>
						</tr>
						<tr>
							<td style="padding: 20px 40px; border-top: 1px solid #252528">
								<p style="margin: 0; font-size: 12px; color: #a8a6a0; text-align: center">
									If you weren't expecting this invite, you can safely ignore this email.
								</p>
							</td>
						</tr>
					</table>
				</td>
			</tr>
		</table>
	</body>
</html>
